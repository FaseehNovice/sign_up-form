<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="imgContainer">
        <img id="bgImg" src="./assets/bg_sign-up.jpg" alt="Background Photo Of Grass">
        <div id="logoContainer">
            <img id="OdinLogo" src="./assets/odin-lined.png" alt="ODIN Logo">
            ODIN
        </div>
    </div>
    <div id="formSection">
        <div id="contentTop">
            <h3>This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up now to get started.
            </h3>
            <h3><em>You know you want to</em></h3>
    
        </div>
        <div id="formSection2">
        <form>
            <div id="divForm">
            <div id="textForm">Let's Do This</div>
            
            <div class="labelBox">
            <label for="fname">First Name</label><br>
            <input type="text" id="fname" name="fname">
            </div>

            <div class="labelBox">
            <label for="lname">Last Name</label><br>
            <input type="text" id="lname" name="lname">
            </div>

            <div class="labelBox">
            <label for="password">Password</label><br>
            <input type="password" id="password" required minlength="6">
            </div>

            <div class="labelBox">
            <label for="cPass">Confirm Password</label><br>
            <input type="password" id="cPass" required minlength="6">
            </div>

            </div>

        </form>
        </div>
        <div id="btnDiv">
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="www.google.com" target="_blank">Log in</a></p>
        </div>
    </div>
</body>
</html>
